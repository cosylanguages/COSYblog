<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="editorial-stars" data-seed="demystifying-english-tenses-it" data-lang="it">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>

    <rect width="1200" height="630" fill="#d69e2e" />

      <polygon points="814,133 419,353 13,139 438,-185" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="534,343 225,490 236,183" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="1004,87 864,296 536,270 523,-162 792,-290" fill="#E8D2C2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="964,259 882,413 724,238 859,109" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="845,414 701,511 660,318" fill="#3A6332" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />



      <g transform="rotate(-8 319.5 326.5)">
        <rect x="154" y="225" width="331" height="203" rx="6" fill="#d69e2e" opacity="0.3" stroke="#3A6332" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(4 555 277.5)">
        <rect x="306" y="140" width="498" height="275" rx="6" fill="#3A6332" opacity="0.3" stroke="#3A6332" stroke-width="1" filter="url(#soft-shadow)" />
      </g>


    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="944,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 964,157.5 944,0" fill="#FCF9F2" opacity="0.9" stroke="#3A6332" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>


    <g transform="rotate(0 463 44)" filter="url(#soft-shadow)">
      <rect x="403" y="32" width="120" height="24" rx="2" fill="#faf7f2" opacity="0.45" />
      <line x1="403" y1="32" x2="403" y2="56" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="523" y1="32" x2="523" y2="56" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>


    <g class="cover-tiny-doodles" stroke="#3A6332" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- Four-pointed sparkle doodle -->
      <path d="M 945 70 Q 945 82 957 82 Q 945 82 945 94 Q 945 82 933 82 Q 945 82 945 70 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 990 112 Q 990 120 998 120 Q 990 120 990 128 Q 990 120 982 120 Q 990 120 990 112 Z" stroke="#faf7f2" stroke-width="1" />
      <!-- Botanical sprig doodle -->
      <path d="M 75 120 C 85 105, 70 85, 90 70" />
      <circle cx="79" cy="105" r="3" fill="#3A6332" opacity="0.5" />
      <circle cx="85" cy="88" r="3" fill="#faf7f2" opacity="0.5" />
    </g>


    <g class="cover-sketchy-underline">
      <path d="M 74 597 Q 177 602 280 599" stroke="#faf7f2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 84 600 Q 177 605 270 599" stroke="#3A6332" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>


    <g class="cover-masthead-label" filter="url(#soft-shadow)">
      <rect x="20" y="20" width="220" height="30" rx="4" fill="#FCF9F2" opacity="0.95" stroke="#faf7f2" stroke-width="1.2" />
      <text x="34" y="40" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1.4">COSYMAGAZINE • GRAMMAR</text>
    </g>


      <g class="cover-text-overlay" filter="url(#soft-shadow)">
        <!-- Warm paper card overlay -->
        <rect class="cover-overlay-box" x="24" y="451" width="1152" height="155" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#3A6332" stroke-width="1.2" />
        <text x="54" y="489" fill="#3A6332" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">GRAMMATICA COSY • Vol. 2026.11</text>
        <text x="54" y="523" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="21" font-weight="bold">Smontare i tempi verbali inglesi: La</text>
<text x="54" y="550" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="21" font-weight="bold">guida definitiva alla linea del tempo</text>
<text x="54" y="577" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="21" font-weight="bold">per studenti italiani</text>
      </g>

      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.5" pointer-events="none" />
    </svg>