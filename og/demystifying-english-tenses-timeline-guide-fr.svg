<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" class="cosy-cover-art" data-motif="editorial-stars" data-seed="demystifying-english-tenses-fr" data-lang="fr">
      <defs>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#3C281E" flood-opacity="0.10" />
        </filter>
        <filter id="paper-grain" x="0%" y="0%" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.05" />
          </feComponentTransfer>
          <feBlend mode="multiply" in="SourceGraphic" result="blend" />
        </filter>
      </defs>
      <style>
        @media (prefers-reduced-motion: reduce) {
          .cosy-cover-art * { animation: none !important; transition: none !important; }
        }
      </style>

    <rect width="1200" height="630" fill="#d69e2e" />

      <polygon points="900,94 762,339 556,88 760,-133" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="398,234 290,380 148,423 66,299 88,156 131,49 302,133" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="213,621 71,709 73,522" fill="#D5E2D9" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="872,604 518,802 606,454" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="431,363 401,449 336,477 248,424 230,333 302,256 402,300" fill="#274B7D" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />

      <polygon points="914,74 699,449 189,441 253,-24 651,-177" fill="#faf7f2" opacity="0.75" style="filter: drop-shadow(2px 3px 3px rgba(60,40,30,0.08));" />



      <g transform="rotate(-2 758 370.5)">
        <rect x="542" y="212" width="432" height="317" rx="6" fill="#d69e2e" opacity="0.3" stroke="#274B7D" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(3 402 407.5)">
        <rect x="155" y="249" width="494" height="317" rx="6" fill="#faf7f2" opacity="0.3" stroke="#274B7D" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(-7 392.5 390.5)">
        <rect x="234" y="259" width="317" height="263" rx="6" fill="#d69e2e" opacity="0.3" stroke="#274B7D" stroke-width="1" filter="url(#soft-shadow)" />
      </g>

      <g transform="rotate(3 422 226)">
        <rect x="183" y="90" width="478" height="272" rx="6" fill="#274B7D" opacity="0.3" stroke="#274B7D" stroke-width="1" filter="url(#soft-shadow)" />
      </g>


    <g class="cover-torn-paper" filter="url(#soft-shadow)">
      <polygon points="988,0 1200,0 1200,283.5 1185,264.59999999999997 1165,289.8 1140,239.4 1110,258.3 1080,220.5 1050,245.70000000000002 1020,201.6 1008,157.5 988,0" fill="#FCF9F2" opacity="0.9" stroke="#274B7D" stroke-width="0.8" stroke-dasharray="3 2" />
    </g>


    <g transform="rotate(3 770 46)" filter="url(#soft-shadow)">
      <rect x="710" y="34" width="120" height="24" rx="2" fill="#faf7f2" opacity="0.45" />
      <line x1="710" y1="34" x2="710" y2="58" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
      <line x1="830" y1="34" x2="830" y2="58" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
    </g>


    <g class="cover-tiny-doodles" stroke="#274B7D" stroke-width="1.5" fill="none" opacity="0.7">
      <!-- Four-pointed sparkle doodle -->
      <path d="M 940 70 Q 940 82 952 82 Q 940 82 940 94 Q 940 82 928 82 Q 940 82 940 70 Z" fill="#faf7f2" opacity="0.3" />
      <path d="M 985 112 Q 985 120 993 120 Q 985 120 985 128 Q 985 120 977 120 Q 985 120 985 112 Z" stroke="#faf7f2" stroke-width="1" />
      <!-- Botanical sprig doodle -->
      <path d="M 31 99 C 41 84, 26 64, 46 49" />
      <circle cx="35" cy="84" r="3" fill="#274B7D" opacity="0.5" />
      <circle cx="41" cy="67" r="3" fill="#faf7f2" opacity="0.5" />
    </g>


    <g class="cover-sketchy-underline">
      <path d="M 62 592 Q 162 598 262 594" stroke="#faf7f2" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75" />
      <path d="M 72 595 Q 162 601 252 594" stroke="#274B7D" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5" />
    </g>


    <g class="cover-masthead-label" filter="url(#soft-shadow)">
      <rect x="20" y="20" width="220" height="30" rx="4" fill="#FCF9F2" opacity="0.95" stroke="#faf7f2" stroke-width="1.2" />
      <text x="34" y="40" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="11" font-weight="bold" letter-spacing="1.4">COSYMAGAZINE • GRAMMAR</text>
    </g>


      <g class="cover-text-overlay" filter="url(#soft-shadow)">
        <!-- Warm paper card overlay -->
        <rect class="cover-overlay-box" x="24" y="436" width="1152" height="170" rx="8" fill="#FCF9F2" opacity="0.96" stroke="#274B7D" stroke-width="1.2" />
        <text x="54" y="474" fill="#274B7D" font-family="Fraunces, 'Lora', Georgia, serif" font-size="17" font-weight="bold" letter-spacing="1.5">GRAMMAIRE SUR MESURE • Vol. 2026.11</text>
        <text x="54" y="510" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">Démystifier les temps en anglais</text>
<text x="54" y="542" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">: Le guide chronologique ultime</text>
<text x="54" y="574" fill="#0d9488" font-family="Fraunces, 'Lora', Georgia, serif" font-size="24" font-weight="bold">pour les francophones</text>
      </g>

      <rect width="1200" height="630" filter="url(#paper-grain)" opacity="0.5" pointer-events="none" />
    </svg>